name: check-openrouter-secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Verify secret is available (never print its value)
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -n "$OPENROUTER_API_KEY" ]; then
            echo "SUCCESS: OPENROUTER_API_KEY is configured and available to GitHub Actions."
          else
            echo "ERROR: OPENROUTER_API_KEY is missing or empty."
            exit 1
          fi
