name: check-openrouter-secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Verify OpenRouter authentication without generating content
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "ERROR: OPENROUTER_API_KEY is missing or empty."
            exit 1
          fi

          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/openrouter-key-check.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $OPENROUTER_API_KEY" \
            https://openrouter.ai/api/v1/key)

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "SUCCESS: OpenRouter accepted the API key."
            echo "No model was called and no content was generated."
          elif [ "$HTTP_STATUS" = "401" ]; then
            echo "ERROR: OpenRouter rejected the API key (HTTP 401). Check the secret value."
            exit 1
          else
            echo "ERROR: OpenRouter key check returned HTTP $HTTP_STATUS."
            echo "Response body intentionally hidden to avoid exposing account details."
            exit 1
          fi
