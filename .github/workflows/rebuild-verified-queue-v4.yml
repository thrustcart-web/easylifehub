name: rebuild-verified-queue-v4

# Manual-only maintenance. Rewrites eligible queued articles using their
# existing verified Amazon products. Does not call product discovery or Blogger.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: 'Maximum existing articles to rebuild (hard cap: 8)'
        required: false
        type: number
        default: 8

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Smoke test OpenRouter free route (one tiny request, no article)
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          if [ -z "$OPENROUTER_API_KEY" ]; then
            echo "OpenRouter smoke test skipped: OPENROUTER_API_KEY is not configured."
            exit 0
          fi

          HTTP_STATUS=$(curl --silent --show-error --max-time 45 \
            --output /tmp/openrouter-smoke.json \
            --write-out "%{http_code}" \
            --header "Authorization: Bearer $OPENROUTER_API_KEY" \
            --header "HTTP-Referer: https://www.easylifehub.top" \
            --header "X-Title: Easy Life Hub" \
            --header "Content-Type: application/json" \
            --request POST \
            --data-binary '{"model":"openrouter/free","messages":[{"role":"user","content":"Reply with exactly OPENROUTER_OK"}],"max_tokens":512}' \
            "https://openrouter.ai/api/v1/chat/completions")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "OpenRouter smoke test warning: HTTP $HTTP_STATUS. The article rebuild will continue with the configured fallback chain."
            echo "- OpenRouter smoke test: HTTP $HTTP_STATUS (article rebuild continued)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/openrouter-smoke.json").read_text(encoding="utf-8"))
          choices = data.get("choices") or []
          message = (choices[0].get("message") or {}) if choices else {}
          content = message.get("content")
          if isinstance(content, str):
              response_text = content
          elif isinstance(content, list):
              response_text = "\\n".join(
                  part.get("text", "")
                  for part in content
                  if isinstance(part, dict) and isinstance(part.get("text"), str)
              )
          else:
              response_text = ""

          if "OPENROUTER_OK" not in response_text:
              print("OpenRouter smoke test warning: expected text was not returned.")
              print("Response body hidden; article rebuild will continue.")
              raise SystemExit(1)

          model = str(data.get("model") or "not reported")
          print("OpenRouter smoke test: SUCCESS")
          print("Selected model: " + model)
          with open(Path(__import__("os").environ["GITHUB_STEP_SUMMARY"]), "a", encoding="utf-8") as summary:
              summary.write("- OpenRouter tiny generation test: SUCCESS (" + model + ").\\n")
          PY

      - name: Rebuild eligible V3 articles as V4 from existing verified products
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
        run: |
          LIMIT="${{ inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT=8; fi
          python3 scripts/rebuild_verified_queue.py --limit "$LIMIT" --verbose

      - name: Commit rebuilt queue
        run: |
          git config user.name "autoblog-bot"
          git config user.email "autoblog-bot@users.noreply.github.com"
          git add -A -- content/queue
          if git diff --cached --quiet; then
            echo "::error::No V4 queue changes were created."
            exit 1
          fi
          git commit -m "content: rebuild verified legacy articles as v4 [skip ci]"
          for attempt in 1 2 3; do
            git fetch origin main
            git rebase origin/main
            if git push origin HEAD:main; then
              echo "Verified V4 queue updates saved to main."
              exit 0
            fi
            echo "Push attempt $attempt failed; retrying."
          done
          echo "::error::Could not save rebuilt queue after three attempts."
          exit 1
