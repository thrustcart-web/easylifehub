name: generate-daily

# Writes new articles into content/queue/ and commits them.
# The Apps Script publisher picks them up on the next posting hour.
# Nothing here touches Blogger, so a failure can never damage your account.

on:
  schedule:
    - cron: '0 3 * * *'          # 03:00 UTC  (= 05:00 Cairo)
  workflow_dispatch:
    inputs:
      count:
        description: 'Leave EMPTY to use the automatic growth ramp (3->6)'
        required: false
        default: ''
      mode:
        description: 'auto (AI + offline fallback) | ai | template'
        required: false
        default: 'auto'
  push:
    paths:
      - 'data/**'
      - 'config.json'
      - 'content/seed/**'
      - 'scripts/**'
      - '.github/workflows/**'
    branches: [ main ]

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Migrate legacy queue or generate articles
        env:
          GROQ_API_KEY:        ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY:     ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY:  ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY:      ${{ secrets.GEMINI_API_KEY }}
          AFFILIATE_TAG:       ${{ secrets.AFFILIATE_TAG }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TEST_API: ${{ secrets.TEST_API || secrets.APIFY_API_TOKEN }}
          APIFY_SPEND_ENABLED: ${{ vars.APIFY_SPEND_ENABLED }}
        run: |
          if [ -f content/queue/MIGRATE_LAYOUT_V3 ]; then
            echo "One-time migration: rebuilding legacy queue HTML with the fixed v3 layout."
            python3 scripts/migrate_legacy_layout.py
            rm content/queue/MIGRATE_LAYOUT_V3
          else
            MODE="${{ github.event.inputs.mode || 'auto' }}"
            COUNT="${{ github.event.inputs.count }}"
            if [ -n "$COUNT" ]; then
              python3 main.py --count "$COUNT" --mode "$MODE" --verbose
            else
              python3 main.py --mode "$MODE" --verbose
            fi
          fi

      - name: Commit queue + state
        run: |
          git config user.name  "autoblog-bot"
          git config user.email "autoblog-bot@users.noreply.github.com"
          # Queue files are the source of truth for the Blogger publisher.
          # Stage them explicitly so the one-time migration cannot be silently lost.
          git add -A -- content/queue
          if [ -d content/categories ]; then git add -A -- content/categories; fi
          if [ -f state.json ]; then git add -- state.json; fi
          if [ -d .cache ]; then git add -A -- .cache; fi
          if [ -d data ]; then git add -A -- data; fi
          echo "Staged changes:"
          git status --short
          if git diff --cached --quiet; then
            echo "Nothing new to commit."
          else
            git commit -m "content: $(date -u +'%Y-%m-%d') queue refresh [skip ci]"
            git push
          fi

      - name: Upload summary
        if: always()
        run: |
          echo "### Generated articles" >> $GITHUB_STEP_SUMMARY
          ls -1 content/queue/*.html 2>/dev/null | wc -l | xargs -I{} echo "Queue size: **{}** posts" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          python3 main.py --ramp >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
          echo '```' >> $GITHUB_STEP_SUMMARY
