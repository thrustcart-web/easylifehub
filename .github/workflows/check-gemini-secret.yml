name: check-gemini-secret

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-secret:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Gemini API key and configured model without generating content
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing or empty."
            exit 1
          fi

          HTTP_STATUS=$(curl --silent --show-error \
            --output /tmp/gemini-model-check.json \
            --write-out "%{http_code}" \
            --header "x-goog-api-key: $GEMINI_API_KEY" \
            "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash")

          if [ "$HTTP_STATUS" = "200" ]; then
            echo "SUCCESS: Gemini API key accepted and gemini-3.8-flash is accessible."
            echo "No model was called and no content was generated."
          elif [ "$HTTP_STATUS" = "401" ]; then
            echo "ERROR: Gemini rejected the API key (HTTP 401). Check the secret value."
            exit 1
          elif [ "$HTTP_STATUS" = "403" ]; then
            echo "ERROR: Gemini denied access (HTTP 403). Check API restrictions and project access."
            exit 1
          elif [ "$HTTP_STATUS" = "404" ]; then
            echo "ERROR: Configured Gemini model was not found (HTTP 404)."
            exit 1
          else
            echo "ERROR: Gemini model check returned HTTP $HTTP_STATUS."
            echo "Response body intentionally hidden."
            exit 1
          fi
