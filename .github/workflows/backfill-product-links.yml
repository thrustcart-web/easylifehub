name: audit-amazon-products

# Audits queued Amazon offers against Creators API stock data, reserves products
# already used by live/scheduled Blogger posts, replaces unavailable/duplicate items,
# and removes CTAs when a safe in-stock replacement cannot be verified.

on:
  workflow_dispatch:
    inputs:
      allow_paid_lookup:
        description: 'Set true to permit the guarded SerpApi fallback during replacement searches'
        required: false
        type: boolean
        default: false
      external_asins:
        description: 'JSON array of ASINs already used by unmanaged live/scheduled Blogger posts'
        required: false
        type: string
        default: '[]'
      published_slugs:
        description: 'JSON array of queue-managed live/scheduled Blogger article slugs'
        required: false
        type: string
        default: '[]'
      blogger_titles:
        description: 'JSON array of live/scheduled/draft Blogger article titles to prevent future duplicates'
        required: false
        type: string
        default: '[]'

permissions:
  contents: write

concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Audit stock and uniqueness for all queued Amazon product links
        env:
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          AMAZON_CREATORS_TOKEN_URL: ${{ vars.AMAZON_CREATORS_TOKEN_URL }}
          PRODUCT_DISCOVERY_PROVIDER: creators_api
          APIFY_SPEND_ENABLED: 'false'
          SERPAPI_SPEND_ENABLED: ${{ inputs.allow_paid_lookup && vars.SERPAPI_SPEND_ENABLED == 'true' && 'true' || 'false' }}
          EXTERNAL_ASINS_JSON: ${{ inputs.external_asins || '[]' }}
          PUBLISHED_SLUGS_JSON: ${{ inputs.published_slugs || '[]' }}
          BLOGGER_TITLES_JSON: ${{ inputs.blogger_titles || '[]' }}
          AFFILIATE_TAG: ${{ secrets.AFFILIATE_TAG }}
        run: python3 scripts/backfill_product_links.py

      - name: Commit updated product URLs
        run: |
          git config user.name "autoblog-bot"
          git config user.email "autoblog-bot@users.noreply.github.com"
          git add -A -- content/queue .cache
          if git diff --cached --quiet; then
            echo "No product-link changes."
          else
            git commit -m "affiliate: audit stock and deduplicate Amazon product links [skip ci]"
            git push
          fi
