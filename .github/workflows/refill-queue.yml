name: refill-queue

# Automatic top-up dispatched by Apps Script whenever approved pending articles fall below the queue threshold.
# Amazon Creators API is primary. SerpApi is a guarded fallback; Apify is never enabled.

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Articles to generate (max 6 per run - the safety cap)'
        required: false
        default: '6'
      mode:
        description: 'auto | ai | template'
        required: false
        default: 'auto'
      allow_paid_lookup:
        description: 'Allow the guarded SerpApi fallback for this refill (set automatically by Apps Script)'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

# Serialize with generate-daily because both workflows update the same queue/state files.
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          AFFILIATE_TAG:      ${{ secrets.AFFILIATE_TAG }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TEST_API: ${{ secrets.TEST_API || secrets.APIFY_API_TOKEN }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          AMAZON_CREATORS_CLIENT_ID: ${{ secrets.AMAZON_CREATORS_CLIENT_ID }}
          AMAZON_CREATORS_CLIENT_SECRET: ${{ secrets.AMAZON_CREATORS_CLIENT_SECRET }}
          AMAZON_CREATORS_TOKEN_URL: ${{ vars.AMAZON_CREATORS_TOKEN_URL }}
          PRODUCT_DISCOVERY_PROVIDER: creators_api
          APIFY_SPEND_ENABLED: 'false'
          SERPAPI_SPEND_ENABLED: ${{ inputs.allow_paid_lookup && vars.SERPAPI_SPEND_ENABLED == 'true' && 'true' || 'false' }}
        run: |
          COUNT="${{ github.event.inputs.count }}"
          MODE="${{ github.event.inputs.mode }}"
          if [ -n "$COUNT" ]; then
            python3 main.py --count "$COUNT" --mode "$MODE" --verbose
          else
            python3 main.py --mode "$MODE" --verbose
          fi

      - name: Commit
        run: |
          git config user.name  "autoblog-bot"
          git config user.email "autoblog-bot@users.noreply.github.com"
          # Stage only paths that are guaranteed to exist. The old command
          # included content/categories (disabled and often absent) and masked
          # git-add errors with "|| true", which could silently stage nothing
          # even after articles had been generated.
          git add -A -- content/queue state.json data .cache
          echo "Staged changes:"
          git status --short --untracked-files=all
          if ! git diff --cached --quiet; then
            git commit -m "content: manual refill ${{ github.event.inputs.count }} [skip ci]"
            # Avoid losing a prepared queue when main changes during a refill.
            for attempt in 1 2 3; do
              echo "Push attempt $attempt/3: fetching and rebasing on latest main..."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Rebase conflict while saving refilled queue."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Refilled queue successfully saved to main."
                exit 0
              fi
              echo "Push was rejected; retrying with the latest main."
            done
            echo "::error::Could not save refilled queue after three attempts."
            exit 1
          else
            echo "::error::No files were staged after generation. Refusing to report a successful refill."
            git status --short --untracked-files=all
            exit 1
          fi
