name: refill-queue

# Automatic top-up dispatched by Apps Script whenever approved pending articles fall below the queue threshold.
# SerpApi is primary and Apify is the guarded fallback. Amazon Creators API is not used.

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Articles to generate (max 6 per run - the safety cap)'
        required: false
        default: '6'
      mode:
        description: 'auto | ai | template'
        required: false
        default: 'auto'
      allow_paid_lookup:
        description: 'Allow paid lookups for this run; SerpApi and Apify each require their own repository spend variable'
        required: false
        type: boolean
        default: false
      focus:
        description: 'general queue refill or the curated long-form monitor-arm series'
        required: false
        type: choice
        options:
          - general
          - monitor_arm
        default: general

permissions:
  contents: write

# Serialize with generate-daily because both workflows update the same queue/state files.
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TEST_API: ${{ secrets.TEST_API || secrets.APIFY_API_TOKEN }}
          PRODUCT_DISCOVERY_PROVIDER: serpapi
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          SERPAPI_SPEND_ENABLED: ${{ inputs.allow_paid_lookup && vars.SERPAPI_SPEND_ENABLED == 'true' && 'true' || 'false' }}
          APIFY_SPEND_ENABLED: ${{ inputs.allow_paid_lookup && vars.APIFY_SPEND_ENABLED == 'true' && 'true' || 'false' }}
        run: |
          COUNT="${{ github.event.inputs.count }}"
          MODE="${{ github.event.inputs.mode }}"
          FOCUS="${{ github.event.inputs.focus || 'general' }}"
          if [ "$FOCUS" = "monitor_arm" ]; then
            # The run-level approval still applies; each provider also checks its own spend variable.
            python3 main.py --count "$COUNT" --mode "$MODE" --focus "$FOCUS" --no-seed --verbose
          elif [ -n "$COUNT" ]; then
            python3 main.py --count "$COUNT" --mode "$MODE" --verbose
          else
            python3 main.py --mode "$MODE" --verbose
          fi

      - name: Commit
        run: |
          git config user.name  "autoblog-bot"
          git config user.email "autoblog-bot@users.noreply.github.com"
          # Stage only paths that are guaranteed to exist. The old command
          # included content/categories (disabled and often absent) and masked
          # git-add errors with "|| true", which could silently stage nothing
          # even after articles had been generated.
          git add -A -- content/queue state.json data .cache
          echo "Staged changes:"
          git status --short --untracked-files=all
          if ! git diff --cached --quiet; then
            git commit -m "content: manual refill ${{ github.event.inputs.count }} [skip ci]"
            # Avoid losing a prepared queue when main changes during a refill.
            for attempt in 1 2 3; do
              echo "Push attempt $attempt/3: fetching and rebasing on latest main..."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Rebase conflict while saving refilled queue."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Refilled queue successfully saved to main."
                exit 0
              fi
              echo "Push was rejected; retrying with the latest main."
            done
            echo "::error::Could not save refilled queue after three attempts."
            exit 1
          else
            echo "::error::No files were staged after generation. Refusing to report a successful refill."
            git status --short --untracked-files=all
            exit 1
          fi
