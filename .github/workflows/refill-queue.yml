name: refill-queue

# Manual top-up button. Use it when the queue gets low (status() in Apps Script
# tells you how many days of content are left).

on:
  workflow_dispatch:
    inputs:
      count:
        description: 'Articles to generate (max 6 per run - the safety cap)'
        required: false
        default: '6'
      mode:
        description: 'auto | ai | template'
        required: false
        default: 'auto'

permissions:
  contents: write

# Serialize with generate-daily because both workflows update the same queue/state files.
concurrency:
  group: generate
  cancel-in-progress: false

jobs:
  refill:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate
        env:
          GROQ_API_KEY:       ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY:    ${{ secrets.MISTRAL_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY:     ${{ secrets.GEMINI_API_KEY }}
          AFFILIATE_TAG:      ${{ secrets.AFFILIATE_TAG }}
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          TEST_API: ${{ secrets.TEST_API || secrets.APIFY_API_TOKEN }}
          SERPAPI_API_KEY: ${{ secrets.SERPAPI_API_KEY }}
          PRODUCT_DISCOVERY_PROVIDER: ${{ vars.PRODUCT_DISCOVERY_PROVIDER }}
          APIFY_SPEND_ENABLED: ${{ vars.APIFY_SPEND_ENABLED }}
          SERPAPI_SPEND_ENABLED: ${{ vars.SERPAPI_SPEND_ENABLED }}
        run: |
          COUNT="${{ github.event.inputs.count }}"
          MODE="${{ github.event.inputs.mode }}"
          if [ -n "$COUNT" ]; then
            python3 main.py --count "$COUNT" --mode "$MODE" --verbose
          else
            python3 main.py --mode "$MODE" --verbose
          fi

      - name: Commit
        run: |
          git config user.name  "autoblog-bot"
          git config user.email "autoblog-bot@users.noreply.github.com"
          git add content/queue content/categories state.json .cache data 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "content: manual refill ${{ github.event.inputs.count }} [skip ci]"
            # Avoid losing a prepared queue when main changes during a refill.
            for attempt in 1 2 3; do
              echo "Push attempt $attempt/3: fetching and rebasing on latest main..."
              git fetch origin main
              if ! git rebase origin/main; then
                echo "::error::Rebase conflict while saving refilled queue."
                git rebase --abort || true
                exit 1
              fi
              if git push origin HEAD:main; then
                echo "Refilled queue successfully saved to main."
                exit 0
              fi
              echo "Push was rejected; retrying with the latest main."
            done
            echo "::error::Could not save refilled queue after three attempts."
            exit 1
          else
            echo "No queue changes to commit."
          fi
