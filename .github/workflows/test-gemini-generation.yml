name: test-gemini-generation

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Make a tiny Gemini response test with transient-error retries
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing or empty."
            exit 1
          fi

          HTTP_STATUS=""
          for attempt in 1 2 3; do
            echo "Gemini test request attempt $attempt/3"
            HTTP_STATUS=$(curl --silent --show-error \
              --output /tmp/gemini-response.json \
              --write-out "%{http_code}" \
              --header "x-goog-api-key: $GEMINI_API_KEY" \
              --header "Content-Type: application/json" \
              --request POST \
              --data-binary '{"contents":[{"parts":[{"text":"Reply with exactly GEMINI_OK"}]}],"generationConfig":{"maxOutputTokens":16}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/gemini-3.8-flash:generateContent")

            if [ "$HTTP_STATUS" = "200" ]; then
              break
            fi

            case "$HTTP_STATUS" in
              500|502|503|504)
                if [ "$attempt" -lt 3 ]; then
                  WAIT_SECONDS=$((4 * (2 ** (attempt - 1))))
                  echo "Gemini temporarily unavailable (HTTP $HTTP_STATUS); retrying in ${WAIT_SECONDS}s."
                  sleep "$WAIT_SECONDS"
                fi
                ;;
              *)
                echo "ERROR: Gemini returned HTTP $HTTP_STATUS; not retrying this error."
                echo "Response content hidden; API key was not printed."
                exit 1
                ;;
            esac
          done

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "ERROR: Gemini remained unavailable after 3 attempts (HTTP $HTTP_STATUS)."
            echo "No article or product lookup was run."
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("/tmp/gemini-response.json").read_text(encoding="utf-8"))
          try:
              response_text = data["candidates"][0]["content"]["parts"][0]["text"].strip()
          except (KeyError, IndexError, TypeError):
              raise SystemExit("ERROR: Gemini returned an unexpected response structure.")

          if response_text == "GEMINI_OK":
              print("SUCCESS: Gemini 3.8 Flash generated the expected test response.")
              print("No article or product lookup was run.")
          else:
              print("ERROR: Gemini responded, but the output did not match the expected test token.")
              raise SystemExit(1)
          PY
