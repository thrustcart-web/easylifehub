name: tests

# Runs the full pipeline test suite on relevant code, test and workflow changes.
# Tests are offline: no network calls, no API keys and no article generation.

on:
  push:
    paths: ['scripts/**', 'tests/**', 'config.json', 'data/**', 'main.py', 'appsscript/**', '.github/workflows/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Run pipeline tests
        run: python3 tests/test_pipeline.py
