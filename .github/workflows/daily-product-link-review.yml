name: daily-product-link-review

# Daily third-party availability evidence review. No Amazon pages are crawled
# and no Blogger links are changed.
on:
  schedule:
    - cron: '20 3 * * *' # 05:20 Africa/Cairo
  workflow_dispatch:
    inputs:
      max_queries:
        description: 'Basic Tavily searches for this run (hard cap 20; default 15)'
        required: false
        default: '15'

permissions:
  contents: write

concurrency:
  group: daily-product-link-review
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Review published Amazon product links using external sources
        env:
          TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
          BLOG_URL: https://www.honesttrove.com
          TAVILY_DAILY_MAX_QUERIES: ${{ github.event.inputs.max_queries || '15' }}
        run: python3 scripts/daily_product_link_review.py

      - name: Commit daily evidence report
        run: |
          git config user.name "honest-trove-bot"
          git config user.email "honest-trove-bot@users.noreply.github.com"
          git add reports/product-link-health
          if git diff --cached --quiet; then
            echo "No new product-link review data."
          else
            git commit -m "report: daily external product availability review [skip ci]"
            git push
          fi
