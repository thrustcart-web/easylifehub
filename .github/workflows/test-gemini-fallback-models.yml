name: test-gemini-fallback-models

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-gemini-fallbacks:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Test tiny response against independent Gemini fallback models
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ -z "$GEMINI_API_KEY" ]; then
            echo "ERROR: GEMINI_API_KEY is missing or empty."
            exit 1
          fi

          for MODEL in gemini-3.6-flash gemini-3.5-flash-lite gemini-3.1-flash-lite; do
            echo "Trying $MODEL with one tiny test request."
            HTTP_STATUS=$(curl --silent --show-error \
              --output /tmp/gemini-response.json \
              --write-out "%{http_code}" \
              --header "x-goog-api-key: $GEMINI_API_KEY" \
              --header "Content-Type: application/json" \
              --request POST \
              --data-binary '{"contents":[{"parts":[{"text":"Reply with exactly GEMINI_OK"}]}],"generationConfig":{"maxOutputTokens":16}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$MODEL:generateContent")

            if [ "$HTTP_STATUS" = "200" ]; then
              if python3 - "$MODEL" <<'PY'
          import json
          import sys
          from pathlib import Path

          model = sys.argv[1]
          data = json.loads(Path("/tmp/gemini-response.json").read_text(encoding="utf-8"))
          candidates = data.get("candidates") or []
          text_parts = []
          for candidate in candidates:
              content = candidate.get("content") or {}
              for part in content.get("parts") or []:
                  if isinstance(part, dict) and isinstance(part.get("text"), str):
                      text_parts.append(part["text"])
          response_text = "\\n".join(text_parts).strip()

          if "GEMINI_OK" in response_text:
              print(f"SUCCESS: {model} generated the expected test response.")
              raise SystemExit(0)

          shapes = []
          for candidate in candidates[:2]:
              parts = (candidate.get("content") or {}).get("parts") or []
              shapes.append({
                  "finishReason": candidate.get("finishReason"),
                  "partKeys": [sorted(part.keys()) for part in parts if isinstance(part, dict)],
              })
          print("No expected text returned. Safe response shape: " + json.dumps({
              "topKeys": sorted(data.keys()),
              "candidateCount": len(candidates),
              "promptBlockReason": (data.get("promptFeedback") or {}).get("blockReason"),
              "candidateShapes": shapes,
          }))
          raise SystemExit(2)
          PY
              then
                echo "No article or product lookup was run."
                exit 0
              else
                echo "$MODEL returned HTTP 200 but no usable test text; trying the next model."
              fi
            else
              case "$HTTP_STATUS" in
                429|500|502|503|504)
                  echo "$MODEL temporarily unavailable (HTTP $HTTP_STATUS); trying the next model."
                  ;;
                *)
                  echo "ERROR: $MODEL returned HTTP $HTTP_STATUS. Not trying more models."
                  echo "Response content hidden; API key was not printed."
                  exit 1
                  ;;
              esac
            fi
          done

          echo "ERROR: No configured Gemini fallback model returned a usable test response."
          echo "No article or product lookup was run."
          exit 1
