name: editorial-drafts

# Stock-independent guides are generated into a separate draft-only directory.
# They are not added to the affiliate publishing queue.
on:
  push:
    paths:
      - 'data/editorial_topics.json'
  schedule:
    - cron: '0 6 * * *' # 08:00 Africa/Cairo
  workflow_dispatch:
    inputs:
      count:
        description: 'Number of editorial drafts (hard cap 3)'
        required: false
        default: '2'

permissions:
  contents: write

concurrency:
  group: editorial-drafts
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate product-independent editorial drafts
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          COUNT="${{ github.event.inputs.count || '2' }}"
          python3 scripts/editorial_generator.py --count "$COUNT"

      - name: Commit editorial drafts
        run: |
          git config user.name "honest-trove-bot"
          git config user.email "honest-trove-bot@users.noreply.github.com"
          git add -A -- content/editorial-drafts
          if git diff --cached --quiet; then
            echo "No new editorial drafts were produced."
          else
            git commit -m "content: add stock-independent editorial drafts [skip ci]"
            git push origin HEAD:main
          fi

      - name: Publishability summary
        if: always()
        run: |
          echo "### Editorial drafts" >> "$GITHUB_STEP_SUMMARY"
          if [ -f content/editorial-drafts/index.json ]; then
            python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          data = json.load(open("content/editorial-drafts/index.json", encoding="utf-8"))
          print(f"Draft-only articles in archive: **{data.get('count', 0)}**")
          print("Blogger affiliate auto-publishing: **disabled for this draft set**")
          for post in data.get("posts", [])[-3:]:
              print(f"- {post.get('title')} ({post.get('words', 0)} words)")
          PY
          fi
